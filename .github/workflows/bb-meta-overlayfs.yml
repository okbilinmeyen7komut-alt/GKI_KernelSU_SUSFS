name: BB meta-overlayfs (resmi kaynak, KernelSU 5e1979d2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - name: KernelSU kaynagini al (meta-overlayfs ayri depoya tasinmadan onceki son hal)
        run: |
          git clone --filter=blob:none https://github.com/tiann/KernelSU ksu
          cd ksu
          git checkout 5e1979d2
          git log -1 --format='%H %ad %s' --date=short
          # Kernel-SU/rustix catali artik erisilemiyor; ayni tarihteki ksud'un kullandigi resmi crates.io surumu
          sed -i 's|^rustix = { git = "https://github.com/Kernel-SU/rustix.git".*|rustix = { version = "=1.0.8", features = ["all-apis"] }|' userspace/meta-overlayfs/Cargo.toml
          grep -n rustix userspace/meta-overlayfs/Cargo.toml
          # Resmi rustix mount() veri parametresi Option<&CStr> istiyor (Kernel-SU catali String kabul ediyordu)
          python3 - <<'PY'
          p = "userspace/meta-overlayfs/src/mount.rs"
          s = open(p).read()
          eski = '            MountFlags::empty(),\n            data,\n        )?;'
          yeni = '            MountFlags::empty(),\n            Some(std::ffi::CString::new(data)?.as_c_str()),\n        )?;'
          assert s.count(eski) == 1, "mount() cagrisi bulunamadi"
          open(p, "w").write(s.replace(eski, yeni))
          print("mount.rs duzeltildi")
          PY

      - name: Rust + cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - name: Derle ve paketle
        working-directory: ksu/userspace/meta-overlayfs
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          bash build.sh
          ls -la target target/module || true
          find target -maxdepth 2 -name '*.zip' -exec sha256sum {} \;

      - name: Zip'i yukle
        uses: actions/upload-artifact@v4
        with:
          name: meta-overlayfs
          path: ksu/userspace/meta-overlayfs/target/*.zip
          if-no-files-found: error
