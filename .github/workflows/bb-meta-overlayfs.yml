name: BB meta-overlayfs (resmi kaynak, KernelSU 5e1979d2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - name: KernelSU kaynagini al (meta-overlayfs ayri depoya tasinmadan onceki son hal)
        run: |
          git clone --filter=blob:none https://github.com/tiann/KernelSU ksu
          cd ksu
          git checkout 5e1979d2
          git log -1 --format='%H %ad %s' --date=short

      - name: Rust + cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - name: Derle ve paketle
        working-directory: ksu/userspace/meta-overlayfs
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          bash build.sh
          ls -la target target/module || true
          find target -maxdepth 2 -name '*.zip' -exec sha256sum {} \;

      - name: Zip'i yukle
        uses: actions/upload-artifact@v4
        with:
          name: meta-overlayfs
          path: ksu/userspace/meta-overlayfs/target/*.zip
          if-no-files-found: error
